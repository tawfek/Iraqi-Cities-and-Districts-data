<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>دليل خريطة المحافظات والأقضية العراقية | Iraqi Interactive Map</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Leaflet CSS & JS for Interactive Map Rendering -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Readex+Pro:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: 'Readex Pro', sans-serif;
        }

        .font-mono-num {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        /* Dark Theme Leaflet Customization */
        .leaflet-container {
            background: #090d16 !important;
            font-family: 'Readex Pro', sans-serif;
        }

        .custom-tooltip {
            background: rgba(15, 23, 42, 0.95) !important;
            border: 1px solid rgba(51, 65, 85, 0.8) !important;
            color: #f8fafc !important;
            border-radius: 12px !important;
            padding: 8px 12px !important;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5) !important;
            direction: rtl;
        }

        .leaflet-tooltip-left::before,
        .leaflet-tooltip-right::before {
            display: none !important;
        }
    </style>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen relative overflow-x-hidden">

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 relative z-10">

        <!-- Top Header -->
        <header class="mb-8 text-center max-w-3xl mx-auto">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-white mb-2 leading-tight">
                🇮🇶 الخريطة التفاعلية للمحافظات والأقضية
            </h1>
            <p class="text-slate-400 text-sm">
                مرر المؤشر فوق المحافظة لمشاهدة التفاصيل والأقضية التابعة لها تلقائياً
            </p>
        </header>

        <!-- Map & Details Container -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-10">

            <!-- Interactive Leaflet Map Box -->
            <div
                class="lg:col-span-2 bg-slate-900/80 border border-slate-800/80 rounded-2xl p-3 backdrop-blur-md shadow-2xl relative">
                <div id="map" class="h-[420px] sm:h-[500px] w-full rounded-xl z-10"></div>

                <!-- Floating Hover Card on Map -->
                <div id="hoverCard"
                    class="absolute bottom-6 right-6 z-20 bg-slate-950/90 border border-slate-800 backdrop-blur-xl p-4 rounded-xl max-w-xs w-full shadow-2xl hidden transition-all pointer-events-none">
                    <span
                        class="text-[10px] text-emerald-400 font-mono font-semibold uppercase tracking-wider block mb-1">المحافظة
                        المحددة</span>
                    <h3 id="hoverName" class="text-lg font-bold text-white mb-1">-</h3>
                    <p id="hoverDetails" class="text-xs text-slate-400">-</p>
                </div>
            </div>

            <!-- Quick Info / Selected City Sidebar -->
            <div
                class="bg-slate-900/80 border border-slate-800/80 rounded-2xl p-5 flex flex-col justify-between backdrop-blur-md">
                <div>
                    <div class="flex items-center justify-between pb-3 border-b border-slate-800 mb-4">
                        <span class="text-xs font-semibold text-slate-400">لوحة الاستعراض السريع</span>
                        <span
                            class="text-[10px] bg-emerald-950 text-emerald-400 border border-emerald-800/40 px-2 py-0.5 rounded-full font-mono-num">
                            تحديث حي
                        </span>
                    </div>

                    <div id="sidebarContent">
                        <div class="text-center py-12 text-slate-500">
                            <svg class="w-10 h-10 mx-auto mb-2 opacity-50" fill="none" stroke="currentColor"
                                viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                    d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122" />
                            </svg>
                            <p class="text-xs">ضع مؤشر الماوس فوق أي محافظة في الخريطة لعرض الأقضية مباشرة</p>
                        </div>
                    </div>
                </div>

                <div class="pt-4 border-t border-slate-800/80 text-center">
                    <button id="resetViewBtn"
                        class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-xl transition w-full">
                        إعادة ضبط زاوية الخريطة
                    </button>
                </div>
            </div>

        </div>

        <!-- Search Bar -->
        <div class="max-w-3xl mx-auto mb-8">
            <div class="relative bg-slate-900/90 border border-slate-800 rounded-2xl p-2 shadow-2xl backdrop-blur-xl">
                <input type="text" id="searchInput" placeholder="ابحث باسم المحافظة، القضاء، أو الناحية..."
                    class="w-full bg-transparent border-none text-white placeholder-slate-500 text-sm focus:outline-none focus:ring-0 px-3 py-1.5" />
            </div>
        </div>

        <!-- Data Grid -->
        <div id="citiesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

    </div>

<script>
    const DATA_BASE_URL = './data';

    let citiesList = [];
    const districtsMap = new Map();
    let map, geojsonLayer;

    // Layer lookup by city ID
    const cityLayerMap = new Map();

    let activeSelectedCity = null;
    let activeLayer = null;

    async function init() {
        initMap();

        try {
            const response = await fetch(`${DATA_BASE_URL}/cities.json`);
            if (!response.ok) throw new Error(`Failed to load cities.json: ${response.status}`);

            const rawCities = await response.json();
            citiesList = rawCities.map(c => ({ ...c, id: Number(c.id) }));

            await fetchAllDistrictsConcurrently(citiesList);

            renderCities(citiesList);
            await loadLocalGeoJSON();

        } catch (err) {
            console.error('Initialization error:', err);
        }
    }

    function initMap() {
        map = L.map('map', {
            center: [33.2232, 43.6793],
            zoom: 5.5,
            zoomControl: false,
            attributionControl: false
        });

        L.control.zoom({ position: 'topleft' }).addTo(map);

        map.on('click', (e) => {
            if (e.originalEvent._stopped) return;
            resetSelection();
        });

        document.getElementById('resetViewBtn')?.addEventListener('click', () => {
            resetSelection();
        });
    }

    function resetSelection() {
        activeSelectedCity = null;
        if (activeLayer && geojsonLayer) {
            geojsonLayer.resetStyle(activeLayer);
            activeLayer = null;
        }
        map.setView([33.2232, 43.6793], 5.5);
        
        document.querySelectorAll('.city-card').forEach(card => {
            card.classList.remove('ring-2', 'ring-emerald-500', 'border-emerald-500');
        });

        const sidebar = document.getElementById('sidebarContent');
        if (sidebar) {
            sidebar.innerHTML = `
                <div class="text-slate-400 text-sm">اختر محافظة من الخريطة لعرض التفاصيل</div>
            `;
        }
    }

    async function loadLocalGeoJSON() {
        try {
            const res = await fetch(`${DATA_BASE_URL}/geoBoundaries-IRQ-ADM1_simplified.geojson`);
            if (!res.ok) throw new Error(`GeoJSON fetch error status: ${res.status}`);

            const geoData = await res.json();

            geojsonLayer = L.geoJSON(geoData, {
                style: featureStyle,
                onEachFeature: onEachFeature
            }).addTo(map);

        } catch (err) {
            console.error('Failed to load local GeoJSON boundary file:', err);
        }
    }

    function featureStyle(feature) {
        return {
            fillColor: '#0ea5e9',
            weight: 1.5,
            opacity: 0.8,
            color: '#334155',
            fillOpacity: 0.25
        };
    }

    function highlightStyle() {
        return {
            fillColor: '#10b981',
            fillOpacity: 0.55,
            weight: 2,
            color: '#34d399'
        };
    }

    function onEachFeature(feature, layer) {
        const matchedCity = findMatchedCity(feature.properties);
        const rawGeoName = feature.properties.shapeName || feature.properties.name || feature.properties.shapeISO || 'Governorate';
        const cityName = matchedCity ? matchedCity.name : rawGeoName;

        if (matchedCity) {
            cityLayerMap.set(Number(matchedCity.id), layer);
        }

        const districtState = matchedCity ? districtsMap.get(Number(matchedCity.id)) : null;
        const districtCount = districtState ? districtState.data.length : 0;

        const tooltipContent = `
          <div class="text-right pointer-events-none">
            <div class="font-bold text-sm text-white">${cityName}</div>
            <div class="text-[11px] text-emerald-400 font-mono mt-0.5">${districtCount} أقضية ونواحي</div>
          </div>
        `;

        // Bind tooltip anchored to the exact geographic center of the feature polygon
        layer.bindTooltip(tooltipContent, {
            permanent: false,
            direction: 'center',
            sticky: false,
            className: 'custom-tooltip shadow-lg border border-slate-700/80 bg-slate-900/90 backdrop-blur-md px-3 py-2 rounded-xl'
        });

        layer.on({
            mouseover: (e) => {
                const l = e.target;
                
                // Recalculate center point on hover so placement is pinned precisely
                if (l.getBounds) {
                    const center = l.getBounds().getCenter();
                    l.openTooltip(center);
                }

                if (!activeSelectedCity) {
                    l.setStyle(highlightStyle());
                    l.bringToFront();
                    updateSidebarDetails(matchedCity, cityName);
                }
            },
            mouseout: (e) => {
                const l = e.target;
                if (l !== activeLayer) {
                    geojsonLayer.resetStyle(l);
                }
                if (!activeSelectedCity) {
                    const sidebar = document.getElementById('sidebarContent');
                    if (sidebar) {
                        sidebar.innerHTML = `<div class="text-slate-400 text-sm">اختر محافظة من الخريطة لعرض التفاصيل</div>`;
                    }
                }
            },
            click: (e) => {
                e.originalEvent._stopped = true;
                selectCityOnMap(matchedCity, layer, false);
            }
        });
    }

    /* Core Selection Handler */
    function selectCityOnMap(city, layer, scrollUpToMap = false) {
        if (!city || !layer) return;

        if (activeLayer && activeLayer !== layer) {
            geojsonLayer.resetStyle(activeLayer);
        }

        activeSelectedCity = city;
        activeLayer = layer;

        activeLayer.setStyle(highlightStyle());
        activeLayer.bringToFront();

        map.fitBounds(activeLayer.getBounds(), { padding: [25, 25] });

        updateSidebarDetails(city, city.name);
        highlightCardBorderOnly(city.id);

        if (scrollUpToMap) {
            document.getElementById('map')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    }

    function highlightCardBorderOnly(cityId) {
        document.querySelectorAll('.city-card').forEach(card => {
            card.classList.remove('ring-2', 'ring-emerald-500', 'border-emerald-500');
        });

        const targetCard = document.getElementById(`city-card-${cityId}`);
        if (targetCard) {
            targetCard.classList.add('ring-2', 'ring-emerald-500', 'border-emerald-500');
        }
    }

    function findMatchedCity(properties) {
        if (!properties) return null;

        const shapeISO = (properties.shapeISO || properties.ISO_1 || '').toUpperCase().trim();

        if (shapeISO) {
            const match = citiesList.find(c => c.iso_code === shapeISO);
            if (match) return match;
        }

        const shapeName = (properties.shapeName || properties.name || '').toLowerCase().trim();
        return citiesList.find(c => {
            const key = (c.key || '').toLowerCase();
            const name = (c.name || '').toLowerCase();
            return shapeName.includes(key) || shapeName.includes(name);
        });
    }

    function getDistrictName(d) {
        if (typeof d === 'string') return d;
        if (!d) return '';
        return d.name || d.ar_name || d.name_ar || '';
    }

    function updateSidebarDetails(city, fallbackName) {
        const sidebar = document.getElementById('sidebarContent');
        if (!sidebar) return;

        if (!city) {
            sidebar.innerHTML = `
                <h3 class="text-lg font-bold text-white mb-1">${fallbackName}</h3>
                <p class="text-xs text-slate-400">لا تتوفر تفاصيل إضافية لهذه المنطقة</p>
            `;
            return;
        }

        const districtState = districtsMap.get(Number(city.id)) || { data: [] };
        const districts = districtState.data;

        sidebar.innerHTML = `
          <div class="mb-3">
            <h3 class="text-xl font-bold text-emerald-400 mb-1">${city.name}</h3>
            <span class="text-xs text-slate-500 font-mono uppercase">${city.key} • ISO: ${city.iso_code || 'N/A'}</span>
          </div>

          <div class="mt-4">
            <div class="text-xs font-semibold text-slate-300 mb-2">الأقضية والنواحي (${districts.length}):</div>
            <div class="flex flex-wrap gap-1.5 max-h-56 overflow-y-auto pr-1">
              ${districts.length > 0 
                ? districts.map(d => `<span class="text-xs bg-slate-800 text-slate-200 border border-slate-700/80 px-2.5 py-1 rounded-lg">${getDistrictName(d)}</span>`).join('')
                : '<span class="text-xs text-slate-500">لا توجد بيانات متاحة</span>'
              }
            </div>
          </div>
        `;
    }

    async function fetchAllDistrictsConcurrently(cities) {
        const fetchPromises = cities.map(async (city) => {
            const cityId = Number(city.id);
            const url = `${DATA_BASE_URL}/${city.id}-${city.key}.json`;
            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error();
                const data = await res.json();

                const districtList = Array.isArray(data) ? data : (data.districts || data.data || []);
                districtsMap.set(cityId, { status: 'success', data: districtList });
            } catch (e) {
                districtsMap.set(cityId, { status: 'error', data: [] });
            }
        });
        await Promise.all(fetchPromises);
    }

    function renderCities(items) {
        const grid = document.getElementById('citiesGrid');
        if (!grid) return;
        grid.innerHTML = '';

        if (items.length === 0) {
            grid.innerHTML = `
                <div class="col-span-full text-center py-12 bg-slate-900/40 border border-slate-800/80 rounded-2xl">
                  <p class="text-slate-400 font-medium">لا توجد نتائج مطابقة للبحث</p>
                </div>
            `;
            return;
        }

        items.forEach(city => {
            const districtState = districtsMap.get(Number(city.id)) || { data: [] };
            const districts = districtState.data;

            const card = document.createElement('div');
            card.id = `city-card-${city.id}`;
            card.className = 'city-card bg-slate-900/70 border border-slate-800/80 hover:border-slate-700/80 rounded-2xl p-5 transition-all duration-300 backdrop-blur-sm flex flex-col justify-between';

            card.innerHTML = `
                <div>
                  <div class="flex items-start justify-between gap-2 mb-3">
                    <div>
                      <h2 class="text-xl font-bold text-white">${city.name}</h2>
                      <span class="text-xs text-slate-500 font-mono capitalize">${city.key} • ${city.iso_code || ''}</span>
                    </div>
                    <span class="text-xs font-mono bg-emerald-950/60 text-emerald-400 border border-emerald-800/40 px-2 py-0.5 rounded-md">
                      ${districts.length} أقضية
                    </span>
                  </div>

                  <div class="mt-4 pt-3 border-t border-slate-800/80">
                    <div class="flex flex-wrap gap-1.5 max-h-40 overflow-y-auto pr-1">
                      ${districts.length > 0 
                        ? districts.map(d => `<span class="text-xs bg-slate-800/90 text-slate-300 border border-slate-700/60 px-2 py-0.5 rounded-md">${getDistrictName(d)}</span>`).join('')
                        : '<span class="text-xs text-slate-500">لا توجد أقضية</span>'
                      }
                    </div>
                  </div>
                </div>

                <div class="mt-5 pt-3 border-t border-slate-800/50 flex justify-end">
                  <button 
                    onclick="handleCardShowOnMap(${city.id})"
                    class="text-xs font-medium text-emerald-400 hover:text-emerald-300 bg-emerald-950/40 hover:bg-emerald-900/50 border border-emerald-800/50 px-3 py-1.5 rounded-xl transition flex items-center gap-1.5 cursor-pointer">
                    <span>عرض على الخريطة</span>
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                  </button>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    window.handleCardShowOnMap = function(cityId) {
        const city = citiesList.find(c => Number(c.id) === Number(cityId));
        const layer = cityLayerMap.get(Number(cityId));

        if (city && layer) {
            selectCityOnMap(city, layer, true);
        }
    };

    document.getElementById('searchInput')?.addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase().trim();
        if (!query) {
            renderCities(citiesList);
            return;
        }
        const filtered = citiesList.filter(city => {
            const name = (city.name || '').toLowerCase();
            const key = (city.key || '').toLowerCase();

            const districtState = districtsMap.get(Number(city.id));
            const matchesDistrict = districtState && districtState.data.some(d => {
                const dName = getDistrictName(d).toLowerCase();
                return dName.includes(query);
            });

            return name.includes(query) || key.includes(query) || matchesDistrict;
        });
        renderCities(filtered);
    });

    init();
</script>
</body>

</html>
