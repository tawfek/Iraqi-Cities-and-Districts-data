<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>دليل خريطة المحافظات والأقضية العراقية | Iraqi Interactive Map</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Leaflet CSS & JS for Interactive Map Rendering -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Readex+Pro:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: 'Readex Pro', sans-serif;
        }

        .font-mono-num {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        /* Dark Theme Leaflet Customization */
        .leaflet-container {
            background: #090d16 !important;
            font-family: 'Readex Pro', sans-serif;
        }

        .custom-tooltip {
            background: rgba(15, 23, 42, 0.95) !important;
            border: 1px solid rgba(51, 65, 85, 0.8) !important;
            color: #f8fafc !important;
            border-radius: 12px !important;
            padding: 8px 12px !important;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5) !important;
            direction: rtl;
        }

        .leaflet-tooltip-left::before,
        .leaflet-tooltip-right::before {
            display: none !important;
        }
    </style>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen relative overflow-x-hidden">

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 relative z-10">

        <!-- Top Header -->
        <header class="mb-8 text-center max-w-3xl mx-auto">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-white mb-2 leading-tight">
                🇮🇶 الخريطة التفاعلية للمحافظات والأقضية
            </h1>
            <p class="text-slate-400 text-sm">
                مرر المؤشر فوق المحافظة لمشاهدة التفاصيل والأقضية التابعة لها تلقائياً
            </p>
        </header>

        <!-- Map & Details Container -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-10">

            <!-- Interactive Leaflet Map Box -->
            <div
                class="lg:col-span-2 bg-slate-900/80 border border-slate-800/80 rounded-2xl p-3 backdrop-blur-md shadow-2xl relative">
                <div id="map" class="h-[420px] sm:h-[500px] w-full rounded-xl z-10"></div>

                <!-- Floating Hover Card on Map -->
                <div id="hoverCard"
                    class="absolute bottom-6 right-6 z-20 bg-slate-950/90 border border-slate-800 backdrop-blur-xl p-4 rounded-xl max-w-xs w-full shadow-2xl hidden transition-all pointer-events-none">
                    <span
                        class="text-[10px] text-emerald-400 font-mono font-semibold uppercase tracking-wider block mb-1">المحافظة
                        المحددة</span>
                    <h3 id="hoverName" class="text-lg font-bold text-white mb-1">-</h3>
                    <p id="hoverDetails" class="text-xs text-slate-400">-</p>
                </div>
            </div>

            <!-- Quick Info / Selected City Sidebar -->
            <div
                class="bg-slate-900/80 border border-slate-800/80 rounded-2xl p-5 flex flex-col justify-between backdrop-blur-md">
                <div>
                    <div class="flex items-center justify-between pb-3 border-b border-slate-800 mb-4">
                        <span class="text-xs font-semibold text-slate-400">لوحة الاستعراض السريع</span>
                        <span
                            class="text-[10px] bg-emerald-950 text-emerald-400 border border-emerald-800/40 px-2 py-0.5 rounded-full font-mono-num">
                            تحديث حي
                        </span>
                    </div>

                    <div id="sidebarContent">
                        <div class="text-center py-12 text-slate-500">
                            <svg class="w-10 h-10 mx-auto mb-2 opacity-50" fill="none" stroke="currentColor"
                                viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                    d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122" />
                            </svg>
                            <p class="text-xs">ضع مؤشر الماوس فوق أي محافظة في الخريطة لعرض الأقضية مباشرة</p>
                        </div>
                    </div>
                </div>

                <div class="pt-4 border-t border-slate-800/80 text-center">
                    <button id="resetViewBtn"
                        class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-xl transition w-full">
                        إعادة ضبط زاوية الخريطة
                    </button>
                </div>
            </div>

        </div>

        <!-- Search Bar -->
        <div class="max-w-3xl mx-auto mb-8">
            <div class="relative bg-slate-900/90 border border-slate-800 rounded-2xl p-2 shadow-2xl backdrop-blur-xl">
                <input type="text" id="searchInput" placeholder="ابحث باسم المحافظة، القضاء، أو الناحية..."
                    class="w-full bg-transparent border-none text-white placeholder-slate-500 text-sm focus:outline-none focus:ring-0 px-3 py-1.5" />
            </div>
        </div>

        <!-- Data Grid -->
        <div id="citiesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

    </div>

    <script>
        const USERNAME = 'tawfek';
        const REPO = 'Iraqi-Cities-and-Districts-data';
        const BRANCH = 'master';
        const BASE_RAW_URL = `https://raw.githubusercontent.com/${USERNAME}/${REPO}/refs/heads/${BRANCH}/data`;

        // Reliable GeoJSON sources for Iraq administrative boundaries
        const GEOJSON_PRIMARY = 'https://media.githubusercontent.com/media/wmgeolab/geoBoundaries/b7dd6a55701c76a330500ad9d9240f2b9997c6a8/releaseData/gbOpen/IRQ/ADM1/geoBoundaries-IRQ-ADM1_simplified.geojson';
        const GEOJSON_SECONDARY = 'https://raw.githubusercontent.com/wjdanalharthi/MENA_GeoJSON/main/MENA%20Countries/Iraq/Iraq_Regions.geojson';

        let citiesList = [];
        const districtsMap = new Map();
        let map, geojsonLayer;

        async function init() {
            initMap();

            try {
                const response = await fetch(`${BASE_RAW_URL}/cities.json`);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

                const rawCities = await response.json();
                // Ensure ID types are consistently stored as Numbers
                citiesList = rawCities.map(c => ({ ...c, id: Number(c.id) }));

                await fetchAllDistrictsConcurrently(citiesList);

                renderCities(citiesList);
                await loadIraqGeoJSON();

            } catch (err) {
                console.error('Initialization error:', err);
            }
        }

        /* Initialize Leaflet Dark Map centered on Iraq */
        function initMap() {
            map = L.map('map', {
                center: [33.2232, 43.6793],
                zoom: 5.5,
                zoomControl: false,
                attributionControl: false
            });

            L.control.zoom({ position: 'topleft' }).addTo(map);

            document.getElementById('resetViewBtn')?.addEventListener('click', () => {
                map.setView([33.2232, 43.6793], 5.5);
                renderCities(citiesList);
            });
        }

        /* Fetch and load GeoJSON with automatic fallback */
        async function loadIraqGeoJSON() {
            let geoData = null;

            try {
                const res = await fetch(GEOJSON_PRIMARY);
                if (!res.ok) throw new Error(`Primary status: ${res.status}`);
                geoData = await res.json();
            } catch (err) {
                console.warn('Primary GeoJSON failed, trying fallback source...', err);
                try {
                    const fallbackRes = await fetch(GEOJSON_SECONDARY);
                    if (!fallbackRes.ok) throw new Error(`Fallback status: ${fallbackRes.status}`);
                    geoData = await fallbackRes.json();
                } catch (fallbackErr) {
                    console.error('All GeoJSON boundary sources failed:', fallbackErr);
                    return;
                }
            }

            geojsonLayer = L.geoJSON(geoData, {
                style: featureStyle,
                onEachFeature: onEachFeature
            }).addTo(map);
        }

        function featureStyle() {
            return {
                fillColor: '#0ea5e9',
                weight: 1.5,
                opacity: 0.8,
                color: '#334155',
                fillOpacity: 0.25
            };
        }

        function onEachFeature(feature, layer) {
            // Evaluate all common geo properties across geoBoundaries & MENA datasets
            const rawGeoName = feature.properties.shapeName || feature.properties.name || feature.properties.NAME_1 || feature.properties.adm1_en || feature.properties.name_en || '';
            const matchedCity = findMatchedCity(rawGeoName);

            const cityName = matchedCity ? (matchedCity.name || matchedCity.key) : rawGeoName;
            const districtCount = matchedCity && districtsMap.get(Number(matchedCity.id))
                ? districtsMap.get(Number(matchedCity.id)).data.length
                : 0;

            // Tooltip configuration
            layer.bindTooltip(`
          <div class="text-right">
            <div class="font-bold text-sm text-white">${cityName}</div>
            <div class="text-[11px] text-emerald-400 font-mono-num mt-0.5">${districtCount} أقضية ونواحي</div>
          </div>
        `, { permanent: false, direction: 'top', className: 'custom-tooltip' });

            layer.on({
                mouseover: (e) => {
                    const l = e.target;
                    l.setStyle({
                        fillColor: '#10b981',
                        fillOpacity: 0.55,
                        weight: 2,
                        color: '#34d399'
                    });
                    l.bringToFront();

                    updateSidebarDetails(matchedCity, cityName);
                },
                mouseout: (e) => {
                    if (geojsonLayer) {
                        geojsonLayer.resetStyle(e.target);
                    }
                },
                click: (e) => {
                    map.fitBounds(e.target.getBounds(), { padding: [25, 25] });

                    // Always sync sidebar and grid cards on click
                    updateSidebarDetails(matchedCity, cityName);

                    if (matchedCity) {
                        filterCardsByCity(matchedCity.id);
                    }
                }
            });
        }

        /* Enhanced matcher for Arabic & English governorate variants */
        function findMatchedCity(properties) {
            if (!properties || !properties.shapeISO) return null;
            return citiesList.find(c => c.iso_code === properties.shapeISO.toUpperCase());
        }

        function updateSidebarDetails(city, fallbackName) {
            const sidebar = document.getElementById('sidebarContent');
            if (!sidebar) return;

            if (!city) {
                sidebar.innerHTML = `
                <h3 class="text-lg font-bold text-white mb-1">${fallbackName}</h3>
                <p class="text-xs text-slate-400">لا تتوفر تفاصيل إضافية لهذه المنطقة</p>
            `;
                return;
            }

            const districtState = districtsMap.get(Number(city.id)) || { data: [] };
            const districts = districtState.data;

            sidebar.innerHTML = `
          <div class="mb-3">
            <h3 class="text-xl font-bold text-emerald-400 mb-1">${city.name || city.ar_name}</h3>
            <span class="text-xs text-slate-500 font-mono uppercase">${city.key} • #${city.id}</span>
          </div>

          <div class="mt-4">
            <div class="text-xs font-semibold text-slate-300 mb-2">الأقضية والنواحي (${districts.length}):</div>
            <div class="flex flex-wrap gap-1.5 max-h-56 overflow-y-auto pr-1">
              ${districts.length > 0
                    ? districts.map(d => {
                        const dName = typeof d === 'string' ? d : (d.name || d.ar_name || d.name_ar);
                        return `<span class="text-xs bg-slate-800 text-slate-200 border border-slate-700/80 px-2.5 py-1 rounded-lg">${dName}</span>`;
                    }).join('')
                    : '<span class="text-xs text-slate-500">لا توجد بيانات متاحة</span>'
                }
            </div>
          </div>
        `;
        }

        async function fetchAllDistrictsConcurrently(cities) {
            const fetchPromises = cities.map(async (city) => {
                const cityId = Number(city.id);
                const url = `${BASE_RAW_URL}/${city.id}-${city.key}.json`;
                try {
                    const res = await fetch(url);
                    if (!res.ok) throw new Error();
                    const data = await res.json();

                    // Safely extract array regardless of schema structure
                    const districtList = Array.isArray(data) ? data : (data.districts || data.data || []);
                    districtsMap.set(cityId, { status: 'success', data: districtList });
                } catch (e) {
                    districtsMap.set(cityId, { status: 'error', data: [] });
                }
            });
            await Promise.all(fetchPromises);
        }

        function filterCardsByCity(cityId) {
            const filtered = citiesList.filter(c => Number(c.id) === Number(cityId));
            renderCities(filtered);
        }

        function renderCities(items) {
            const grid = document.getElementById('citiesGrid');
            if (!grid) return;
            grid.innerHTML = '';

            if (items.length === 0) {
                grid.innerHTML = `
                <div class="col-span-full text-center py-12 bg-slate-900/40 border border-slate-800/80 rounded-2xl">
                  <p class="text-slate-400 font-medium">لا توجد نتائج مطابقة للبحث</p>
                </div>
            `;
                return;
            }

            items.forEach(city => {
                const districtState = districtsMap.get(Number(city.id)) || { data: [] };
                const districts = districtState.data;

                const card = document.createElement('div');
                card.className = 'bg-slate-900/70 border border-slate-800/80 hover:border-slate-700/80 rounded-2xl p-5 transition backdrop-blur-sm';

                card.innerHTML = `
                <div class="flex items-start justify-between gap-2 mb-3">
                  <div>
                    <h2 class="text-xl font-bold text-white">${city.name || city.ar_name}</h2>
                    <span class="text-xs text-slate-500 font-mono capitalize">${city.key}</span>
                  </div>
                  <span class="text-xs font-mono bg-emerald-950/60 text-emerald-400 border border-emerald-800/40 px-2 py-0.5 rounded-md">
                    ${districts.length} أقضية
                  </span>
                </div>

                <div class="mt-4 pt-3 border-t border-slate-800/80">
                  <div class="flex flex-wrap gap-1.5 max-h-40 overflow-y-auto pr-1">
                    ${districts.length > 0
                        ? districts.map(d => {
                            const dName = typeof d === 'string' ? d : (d.name || d.ar_name || d.name_ar);
                            return `<span class="text-xs bg-slate-800/90 text-slate-300 border border-slate-700/60 px-2 py-0.5 rounded-md">${dName}</span>`;
                        }).join('')
                        : '<span class="text-xs text-slate-500">لا توجد أقضية</span>'
                    }
                  </div>
                </div>
            `;
                grid.appendChild(card);
            });
        }

        document.getElementById('searchInput')?.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            if (!query) {
                renderCities(citiesList);
                return;
            }
            const filtered = citiesList.filter(city => {
                const name = (city.name || city.id || city.key || '').toLowerCase();
                const key = (city.key || '').toLowerCase();

                const districtState = districtsMap.get(Number(city.id));
                const matchesDistrict = districtState && districtState.data.some(d => {
                    const dName = (typeof d === 'string' ? d : (d.name || d.ar_name || d.name_ar || '')).toLowerCase();
                    return dName.includes(query);
                });

                return name.includes(query) || key.includes(query) || matchesDistrict;
            });
            renderCities(filtered);
        });

        init();
    </script>
</body>

</html>
